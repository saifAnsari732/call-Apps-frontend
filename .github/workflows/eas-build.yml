name: EAS Cloud Build (Expo)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS Build Profile'
        required: true
        type: choice
        default: 'preview'
        options:
          - 'preview'
          - 'preview-aab'
          - 'production'
          - 'production-apk'
          - 'development'

jobs:
  eas-build:
    name: EAS Cloud Build (${{ inputs.profile }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install Dependencies
        run: |
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Run EAS Build
        run: |
          eas build --platform android --profile ${{ inputs.profile }} --non-interactive
