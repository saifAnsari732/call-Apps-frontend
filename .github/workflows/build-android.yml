name: Build Android (APK & AAB)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - '.vscode/**'
      - '.claude/**'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Choose Build Target'
        required: true
        type: choice
        default: 'both'
        options:
          - 'both'
          - 'apk'
          - 'aab'
      build_profile:
        description: 'Build Variant'
        required: true
        type: choice
        default: 'release'
        options:
          - 'release'
          - 'debug'

jobs:
  build:
    name: Build Android (${{ inputs.build_type || 'both' }} - ${{ inputs.build_profile || 'release' }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Dependencies
        run: |
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Setup Environment Variables
        run: |
          echo "EXPO_NO_TELEMETRY=1" >> $GITHUB_ENV
          echo "CI=false" >> $GITHUB_ENV

      - name: Generate Native Android Project (Expo Prebuild)
        run: |
          npx expo prebuild --platform android --clean

      - name: Configure Android Signing & Keystore
        run: |
          mkdir -p android/app
          # If custom release keystore secret is provided in repository secrets, use it
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Using custom secret keystore..."
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore
            echo "RELEASE_STORE_FILE=release.keystore" >> android/gradle.properties
            echo "RELEASE_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS || 'kisanconnect' }}" >> android/gradle.properties
            echo "RELEASE_STORE_PASSWORD=${{ secrets.ANDROID_STORE_PASSWORD || 'android' }}" >> android/gradle.properties
            echo "RELEASE_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD || 'android' }}" >> android/gradle.properties
          else
            echo "Generating automated signing keystore for CI/CD release build..."
            keytool -genkey -v \
              -keystore android/app/release.keystore \
              -alias kisanconnect \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=KisanConnect, OU=Mobile, O=Kisan, L=Delhi, S=Delhi, C=IN"
            
            echo "RELEASE_STORE_FILE=release.keystore" >> android/gradle.properties
            echo "RELEASE_KEY_ALIAS=kisanconnect" >> android/gradle.properties
            echo "RELEASE_STORE_PASSWORD=android" >> android/gradle.properties
            echo "RELEASE_KEY_PASSWORD=android" >> android/gradle.properties
          fi

          # Ensure app/build.gradle configures release signingConfig properly
          node -e "
            const fs = require('fs');
            const file = 'android/app/build.gradle';
            if (fs.existsSync(file)) {
              let content = fs.readFileSync(file, 'utf8');
              if (!content.includes('signingConfigs.release.storeFile')) {
                content = content.replace(
                  /signingConfigs\s*\{/,
                  \`signingConfigs {
        release {
            if (project.hasProperty('RELEASE_STORE_FILE')) {
                storeFile file(RELEASE_STORE_FILE)
                storePassword RELEASE_STORE_PASSWORD
                keyAlias RELEASE_KEY_ALIAS
                keyPassword RELEASE_KEY_PASSWORD
            } else {
                signingConfig signingConfigs.debug
            }
        }\`
                );
                content = content.replace(
                  /buildTypes\s*\{\s*release\s*\{([^}]*)\}/s,
                  (match, p1) => {
                    if (p1.includes('signingConfig')) {
                      return match.replace(/signingConfig\s+signingConfigs\.\w+/, 'signingConfig signingConfigs.release');
                    }
                    return 'buildTypes {\n        release {\n' + p1 + '            signingConfig signingConfigs.release\n        }';
                  }
                );
                fs.writeFileSync(file, content);
                console.log('Successfully patched android/app/build.gradle with release signingConfig');
              }
            }
          "

      - name: Build APK (Android Application Package)
        if: ${{ inputs.build_type == 'apk' || inputs.build_type == 'both' || github.event_name == 'push' }}
        run: |
          cd android
          chmod +x gradlew
          if [ "${{ inputs.build_profile }}" = "debug" ]; then
            echo "Building Debug APK..."
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            echo "Building Release APK..."
            ./gradlew assembleRelease --no-daemon --stacktrace
          fi

      - name: Build AAB (Android App Bundle for Play Store)
        if: ${{ inputs.build_type == 'aab' || inputs.build_type == 'both' || github.event_name == 'push' }}
        run: |
          cd android
          chmod +x gradlew
          if [ "${{ inputs.build_profile }}" = "debug" ]; then
            echo "Building Debug AAB..."
            ./gradlew bundleDebug --no-daemon --stacktrace
          else
            echo "Building Release AAB..."
            ./gradlew bundleRelease --no-daemon --stacktrace
          fi

      - name: Organize Build Output Files
        run: |
          mkdir -p build-artifacts
          
          # Find and copy APK files
          find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} build-artifacts/ \; 2>/dev/null || true
          
          # Find and copy AAB files
          find android/app/build/outputs/bundle/ -name "*.aab" -exec cp {} build-artifacts/ \; 2>/dev/null || true
          
          echo "=== Generated Build Artifacts ==="
          ls -lah build-artifacts/

      - name: Upload APK & AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KisanConnect-Android-${{ github.sha }}
          path: build-artifacts/
          retention-days: 30

      - name: Create GitHub Release (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build-artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
